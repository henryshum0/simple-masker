<!DOCTYPE html>
<html>
    <head>
        <title>Simple Masker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
        <script src="{{ url_for('static', filename='main.js') }}"></script>
    </head>
    <div id="custom-cursor"></div>
    <body>
        <div id="custom-cursor"></div>
        <div id="paint-controls">
            <div class="control-button" id="control-open" onclick="openImage();">📂 Open</div>
            <div class="control-button" id="control-openmask" onclick="openMask();">📂 Open Mask</div>
            <div class="control-button" id="control-hide" onclick="hideUI();">Hide UI (h)</div>
            <div class="control-button" id="control-toggle-mask" onclick="toggleMask();">Toggle Mask (m)</div>
            <div class="control-button" id="control-save" onclick="saveMask('{{category}}', {{img_num}});">💾 Save (s)</div>
            <div class="control-button" id="control-switch" onclick="switchColor();">⚪️ White (c)</div>
            <div class="control-button" id="control-size-inc" onclick="changeBrushSize(3);">🖌 Size+ (e/1)</div>
            <div class="control-button" id="control-size-dec" onclick="changeBrushSize(-3);">🖌 Size- (q/2)</div>
            <div class="control-button" id="pen-size"></div>
            <div class="control-button" id="control-undo" onclick="undo();">↩️ Undo (ctrl+z)</div>
            <div class="control-button" id="control-redo" onclick="redo();">↪️ Redo (ctrl+y)</div>
            <div class="control-button" id="control-redo" onclick="resetMask()">↪️ Reset Mask (f)</div>
        </div>
        <div id="container">
            <canvas id="mask-canvas" ></canvas>
            <img id="mask-image">
        </div>
        <script>
            setupCanvas();
        </script>
    </body>
</html>
